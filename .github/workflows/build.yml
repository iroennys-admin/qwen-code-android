name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install Android SDK Platform 36
      run: sdkmanager "platforms;android-36"
      
    - name: Install npm dependencies
      run: npm install
      
    - name: Build web app
      run: npx vite build
      
    - name: Sync Capacitor
      run: npx @capacitor/cli sync android
      
    - name: Make gradlew executable
      run: chmod +x android/gradlew
      
    - name: Accept Android Licenses
      run: yes | sdkmanager --licenses 2>/dev/null || true
      
    - name: Build APK (Debug)
      working-directory: android
      run: ./gradlew assembleDebug
      
    - name: List APK outputs
      run: find android/app/build/outputs -name "*.apk" -type f
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: qwen-code-android-apk
        path: android/app/build/outputs/apk/debug/*.apk
