<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Qwen Code</title>
    <style>
      /* Critical CSS for splash */
      body { margin: 0; background: #0a0a1a; display: flex; align-items: center; justify-content: center; height: 100vh; }
      .splash { text-align: center; color: #6b6bff; font-family: system-ui; }
      .splash h1 { font-size: 2em; margin-bottom: 0.5em; }
      .splash p { color: #a0a0cc; }
      .loader { width: 40px; height: 40px; border: 3px solid rgba(107,107,255,0.2); border-top-color: #6b6bff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 20px auto; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash">
        <h1>Qwen Code</h1>
        <div class="loader"></div>
        <p>Inicializando...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
